name: Project file visibility
on:
  pull_request:
  push:
    branches: [feature/project-file-visibility]
permissions:
  contents: read
jobs:
  ownership-and-uploads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Use runner Java 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - run: python -m pip install pyspark==3.5.7
      - run: PYTHONPATH=src SPARK_LOCAL_IP=127.0.0.1 python -m unittest discover -s tests/project_visibility -v
