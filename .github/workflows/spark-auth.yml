name: Spark deployment authentication
on:
  pull_request:
    paths:
      - src/mutation_indexer/driver.py
      - tests/standalone/**
      - .github/workflows/spark-auth.yml
  push:
    branches: [mmrf]
    paths:
      - src/mutation_indexer/driver.py
      - tests/standalone/**
      - .github/workflows/spark-auth.yml
permissions:
  contents: read
jobs:
  authentication-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests/standalone -v
